services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ../01_api
    environment:
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - redis

  worker:
    build: ../02_worker
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis